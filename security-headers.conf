# 🛡️ SECURITY: Global Security Headers
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 🌍 DYNAMIC CSP: Variables injected via entrypoint.sh
# NOTE: 'unsafe-eval' and 'unsafe-inline' are currently required by Excalidraw's core engine
# and some React-based build optimizations. moved toward a stricter policy if possible.
# 🛡️ SECURITY: Pin unpkg.com to specific Excalidraw version
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com/@excalidraw/excalidraw@0.18.0/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://res.cloudinary.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' ${API_DOMAIN} ${SOCKET_DOMAIN};" always;
